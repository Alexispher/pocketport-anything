[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketport-anything"
version = "0.2.0"
description = "Evidence-first Nintendo 3DS porting orchestration, examples, and a scoped IR translator"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "PocketPort Anything contributors"}]

[project.scripts]
pocketport = "pocketport.cli:main"

[tool.setuptools.packages.find]
include = ["pocketport*"]
