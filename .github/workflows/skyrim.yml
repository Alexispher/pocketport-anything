name: Skyrim host parsing and native C scene tests
on:
  push:
    branches:
      - feature/skyrim-native-runtime
      - feature/antigravity-skyrim-rendering
      - feature/universal-3ds-dual-screen-skill
      - feature/full-game-porting-framework
  pull_request:
jobs:
  skyrim-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-optional.txt pytest
      - name: Compile Python
        run: python -m compileall -q pocketport
      - name: All unittest regressions including native GCC loader
        run: python -m unittest discover -s tests -v
      - name: All Pytest regressions
        run: python -m pytest -q
      - name: Original dual-screen profile CLI checks
        run: |
          python -m pocketport screen-assess examples/source-port/display-profile.json
          python -m pocketport screen-header examples/source-port/display-profile.json --out /tmp/pp_screen_profile.h
          grep PP_PROFILE_ENABLED_PAGES /tmp/pp_screen_profile.h
      - name: Source-port pipeline CLI smoke test on repository source
        run: |
          python -m pocketport inspect-source . --out /tmp/pocketport-own-source.json
          test -s /tmp/pocketport-own-source.json
          python -m pocketport port . --out /tmp/pocketport-self-audit --target new3ds
          python -m pocketport verify-port /tmp/pocketport-self-audit
      - name: Preserve existing PPIR compilation
        run: python -m pocketport verify-ir examples/translation-demo/score.ppir
      - name: Preserve existing original game gameplay regressions
        run: python -m pocketport test examples/source-port/project.json --host
      - name: Native toolchain availability report
        shell: bash
        run: |
          if command -v arm-none-eabi-gcc && command -v 3dsxtool && command -v picasso; then
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make -C examples/skyrim-native
          else
            echo "devkitARM/3dsxtool/picasso absent: .3dsx NOT cross-compiled in this runner"
          fi

  skyrim-3dsx:
    name: Native New 3DS cross-compile (no emulator claim)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Verify devkitPro toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          command -v arm-none-eabi-gcc
          command -v picasso
          command -v 3dsxtool
          test -d "${DEVKITARM:-/opt/devkitpro/devkitARM}"
          test -f "${DEVKITPRO:-/opt/devkitpro}/libctru/include/3ds.h"
          arm-none-eabi-gcc --version | head -1
      - name: Cross-compile native Citro3D viewer
        shell: bash
        run: |
          set -euxo pipefail
          make -C examples/skyrim-native
          test -s examples/skyrim-native/pocketport-skyrim.3dsx
          sha256sum examples/skyrim-native/pocketport-skyrim.3dsx
      - name: Real PICA200 texture encoder smoke test
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          command -v tex3ds
          python3 - <<'PY'
          import struct, zlib
          def chunk(kind,data):
              return (struct.pack(">I",len(data))+kind+data+
                      struct.pack(">I",zlib.crc32(kind+data)&0xffffffff))
          raw=b"".join(b"\x00"+bytes((220,80,40,255))*16 for _ in range(16))
          png=(b"\x89PNG\r\n\x1a\n"+
               chunk(b"IHDR",struct.pack(">IIBBBBB",16,16,8,6,0,0,0))+
               chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))
          open("/tmp/pocketport-test.png","wb").write(png)
          PY
          tex3ds -f rgba8 -o /tmp/pocketport-test.t3x /tmp/pocketport-test.png
          test -s /tmp/pocketport-test.t3x
          sha256sum /tmp/pocketport-test.t3x
      - name: Generate original SD scene and validate formats
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          PYTHONPATH=. python3 -m pocketport.skyrim.fixture --output /tmp/pocketport-release
          test -s /tmp/pocketport-release/3ds/pocketport/skyrim/scene.ppsc
          test -s /tmp/pocketport-release/3ds/pocketport/skyrim/mesh.ppmg
          PYTHONPATH=. python3 - <<'PY'
          from pathlib import Path
          from pocketport.skyrim.scene import read_scene
          from pocketport.skyrim.nif import decode_mesh
          d=Path("/tmp/pocketport-release/3ds/pocketport/skyrim")
          assert read_scene((d/"scene.ppsc").read_bytes())["count"] == 3
          assert len(decode_mesh((d/"mesh.ppmg").read_bytes()).triangles) > 12
          PY
      - name: Package authentic .3dsx and ready-to-copy SD scene
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/pocketport-release
          cp examples/skyrim-native/pocketport-skyrim.3dsx /tmp/pocketport-release/
          cat > /tmp/pocketport-release/README.txt <<'EOF'
          PocketPort Skyrim - Original 3D test scene
          ==========================================
          1. Launch pocketport-skyrim.3dsx with Azahar 2126.2.
          2. The EXE contains a compiled original 3D scene and does not need Skyrim files.
          3. Optional: copy the supplied 3ds/ folder to the root of Azahar's emulated
             SD card (sdmc), preserving 3ds/pocketport/skyrim/scene.ppsc and mesh.ppmg.
          4. Use Circle Pad or D-pad to pan, START to exit.
          5. Real licensed Skyrim LE/SE files are NOT shipped in this package.
          Passing CI proves cross-compilation, not actual Azahar framebuffer rendering.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src=Path("/tmp/pocketport-release")
          with zipfile.ZipFile("pocketport-skyrim-azahar-test.zip","w",zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(src.rglob("*")):
                  if p.is_file():
                      archive.write(p,p.relative_to(src).as_posix())
          PY
          test -s pocketport-skyrim-azahar-test.zip
      - name: Upload complete Azahar test kit
        uses: actions/upload-artifact@v4
        with:
          name: pocketport-skyrim-azahar-test-kit
          path: pocketport-skyrim-azahar-test.zip
          if-no-files-found: error
      - name: Cross-compile original dual-screen Star Catcher
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make -C examples/source-port
          test -s examples/source-port/star-catcher.3dsx
          sha256sum examples/source-port/star-catcher.3dsx
      - name: Upload original dual-screen 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: pocketport-star-catcher-dual-screen-3dsx
          path: examples/source-port/star-catcher.3dsx
          if-no-files-found: error
      - name: Upload authentic native binary
        uses: actions/upload-artifact@v4
        with:
          name: pocketport-skyrim-native-3dsx
          path: examples/skyrim-native/pocketport-skyrim.3dsx
          if-no-files-found: error

  edgar-external-source:
    name: Real GPL game source import and audited renderer adaptation (no game-port claim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain original game under its upstream GPL license (not committed)
        uses: actions/checkout@v4
        with:
          repository: riksweeney/edgar
          ref: 94d76ebe6a1533caefc89d9201ac3fc4ee974703
          path: external/edgar
          persist-credentials: false
      - name: Inspect real C/SDL2 game and generate narrow reviewed adaptation
        shell: bash
        run: |
          set -euxo pipefail
          python -m pocketport inspect-source external/edgar --out /tmp/edgar-source-report.json
          python -m pocketport port external/edgar --target new3ds --adapter edgar-sdl2 --copy-assets --out /tmp/edgar-source-3ds
          python -m pocketport verify-port /tmp/edgar-source-3ds
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          source=Path("external/edgar")
          output=Path("/tmp/edgar-source-3ds")
          m=json.loads((output/"port.json").read_text())
          inspect=json.loads((output/"inspection.json").read_text())
          assert m["schema_version"]==1 and m["adapter"]=="edgar-sdl2"
          assert m["status"]=="SOURCE_ADAPTED_NOT_NATIVE_COMPILED"
          assert len(m["files"])>7000
          assert len(m["patches"])==1
          assert inspect["files"]["source_files"]>300
          assert "src/main.c" in inspect["entrypoint_candidates"]
          for part in ("src/main.c","src/game.c","src/system/load_save.c",
                       "src/audio/audio.c","src/graphics/graphics.c"):
              assert (source/part).read_bytes()==(output/"source"/part).read_bytes(),part
          assert (source/"src/init.c").read_bytes()!=(output/"source/src/init.c").read_bytes()
          assert b"SDL_RENDERER_SOFTWARE" in (output/"source/src/init.c").read_bytes()
          assert (output/"source"/"music").is_dir()
          assert (output/"source"/"data").is_dir()
          assert (output/"source"/"sound").is_dir()
          print("REAL_GAME_SOURCE_IMPORTED",len(m["files"]),"files")
          print("GAMEPLAY_FILES_PRESERVED",5)
          print("NATIVE_GAME_BUILD_NOT_YET_ATTEMPTED")
          print("FULL_GAME_PLAYABILITY_NOT_CLAIMED")
          PY

  abbaye-real-native-game:
    name: Real GPL game source to native .3dsx (independent of PocketPort examples)
    if: github.ref == 'refs/heads/feature/full-game-porting-framework' || github.event.pull_request.head.ref == 'feature/full-game-porting-framework'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Get original existing GPLv3 native source port (pinned independent upstream)
        uses: actions/checkout@v4
        with:
          repository: JeffRuLz/abbayedesmorts-3ds
          ref: 86caabf56dc3d8f26a181e3cf93b298d11cd4d18
          path: external/abbaye
          persist-credentials: false
      - name: Import whole game source and freely licensed RomFS resources
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          python3 -m pocketport inspect-source external/abbaye --out /tmp/abbaye-original-report.json
          python3 -m pocketport port external/abbaye --out /tmp/pocketport-abbaye --target new3ds --copy-assets
          python3 -m pocketport verify-port /tmp/pocketport-abbaye
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=Path("/tmp/pocketport-abbaye")
          m=json.loads((a/"port.json").read_text())
          assert len(m["files"])>=60
          assert (a/"source/src/main.c").is_file()
          assert (a/"source/src/game.c").is_file()
          assert (a/"source/src/enemies.c").is_file()
          assert (a/"source/src/3ds/graphics.c").is_file()
          assert (a/"source/src/3ds/audio.c").is_file()
          assert (a/"source/romfs/data/map.txt").is_file()
          assert (a/"source/romfs/sounds/AreaIChurchN.wav").is_file()
          assert (a/"source/COPYING").is_file()
          assert m["adapter"]=="none"
          print("ACTUAL_GPL_GAME_SOURCE_PRESERVED",len(m["files"]))
          PY
      - name: Compile the game's REAL C gameplay code with devkitARM
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          python3 -m pocketport port-build /tmp/pocketport-abbaye --execute-trusted-build --timeout 360
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("/tmp/pocketport-abbaye/native-build.json").read_text())
          assert r["status"]=="CROSS_COMPILED"
          assert any(Path("/tmp/pocketport-abbaye",x["file"]).read_bytes()[:4]==b"3DSX" for x in r["artifacts"])
          print("REAL_GAME_NATIVE_ARTIFACTS",r["artifacts"])
          PY
      - name: Package game, complete GPL source, original resources and provenance
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pocketport port-package /tmp/pocketport-abbaye --out /tmp/abbaye-native-source-bundle.zip --redistribution-authorized
          test -s /tmp/abbaye-native-source-bundle.zip
          sha256sum /tmp/abbaye-native-source-bundle.zip
      - name: Upload corresponding source and authentic .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: pocketport-real-game-abbaye-native-with-gpl-source
          path: /tmp/abbaye-native-source-bundle.zip
          if-no-files-found: error
